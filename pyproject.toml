[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spit-bash"
version = "0.1.0"
description = "A local job runner for SPIT DAGs"
requires-python = ">=3.10"

[project.scripts]
spit-bash = "spit_bash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
