name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a change to SPIT's DAG format shows up even when this repository is quiet.
    - cron: '17 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  examples:
    # Builds SPIT from `usability`, the branch its work merges into (its `main`
    # is far behind), and runs the examples end to end. A change made in both
    # repositories has one branch name in each, so a branch that SPIT also has
    # builds SPIT's branch instead, and the two are tested together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choose SPIT's branch
        id: spit
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=usability
          if [ "$BRANCH" != main ] && [ "$BRANCH" != usability ] &&
              git ls-remote --exit-code --heads https://github.com/eclnz/spit "refs/heads/$BRANCH" > /dev/null; then
            ref=$BRANCH
          fi
          echo "Building SPIT from $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: eclnz/spit
          ref: ${{ steps.spit.outputs.ref }}
          path: spit
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path spit/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m unittest tests/test_examples.py -v
        env:
          SPIT: ${{ github.workspace }}/spit/target/release/spit

  messie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: messie -af .
